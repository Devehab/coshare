# Builds CoShare for Android and runs its JVM tests on every change: the Swift interop vectors, two Android
# engines syncing, and a live sync against the desktop engine (desktop/tools/peer.js). Lint and R8 run too.
# For an android-v* tag it publishes a signed CoShare-android.apk:
#   - on the version's own release (never marked "latest": the desktop release keeps
#     releases/latest/download/... working for website/index.html and website/install.sh), and
#   - on the "android-latest" release, whose link never changes:
#     https://github.com/Devehab/coshare/releases/download/android-latest/CoShare-android.apk
name: Android app

on:
  push:
    tags: ["android-v*"]
    branches: [main]
    paths: ["android/**", "desktop/src/core/**", "desktop/tools/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "desktop/src/core/**", "desktop/tools/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK platform 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Desktop engine for the interop test (no Electron needed)
        working-directory: desktop
        run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Version from the tag (android-v1.2.3 → 1.2.3)
        if: startsWith(github.ref, 'refs/tags/android-v')
        run: echo "APP_VERSION=${GITHUB_REF_NAME#android-v}" >> "$GITHUB_ENV"

      - name: Release signing key
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/coshare-release.jks"
          echo "COSHARE_KEYSTORE=$RUNNER_TEMP/coshare-release.jks" >> "$GITHUB_ENV"

      - name: Tests, lint and the release APK
        run: ./gradlew --no-daemon :core:test :app:lintRelease :app:assembleRelease ${APP_VERSION:+-PappVersion=$APP_VERSION}
        env:
          COSHARE_REQUIRE_INTEROP: "1"
          COSHARE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          COSHARE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          COSHARE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Name the APK (signed for a tag, unsigned otherwise)
        run: |
          mkdir -p ../out
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$apk" ../out/CoShare-android.apk
          ls -la ../out
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/aapt2" dump badging ../out/CoShare-android.apk | grep -E "^package|sdkVersion|targetSdkVersion"
          if [ -n "${COSHARE_KEYSTORE:-}" ]; then "$BUILD_TOOLS/apksigner" verify --print-certs ../out/CoShare-android.apk; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coshare-android
          if-no-files-found: ignore
          path: |
            out/CoShare-android.apk
            android/core/build/reports/tests/
            android/app/build/reports/lint-results-release.html

  release:
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: coshare-android
          path: dl
      - name: Find the APK
        run: cp "$(find dl -name CoShare-android.apk | head -1)" CoShare-android.apk && ls -la CoShare-android.apk

      - uses: softprops/action-gh-release@v2
        with:
          name: CoShare for Android ${{ github.ref_name }}
          make_latest: false
          files: CoShare-android.apk
          body: |
            **CoShare for Android** — one clipboard for all your devices. Local network only, end-to-end encrypted, any account.

            Android 8 or later, phones and tablets. Download `CoShare-android.apk`, open it and allow installing from your browser.
            The newest Android build is always at
            https://github.com/Devehab/coshare/releases/download/android-latest/CoShare-android.apk

      - name: Update the fixed "android-latest" link
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          title="CoShare for Android ${VERSION#android-v}"
          notes="Always the newest CoShare for Android (now ${VERSION#android-v}): https://github.com/Devehab/coshare/releases/download/android-latest/CoShare-android.apk
          Android 8 or later, phones and tablets. Install guide: https://devehab.github.io/coshare/#android"
          if gh release view android-latest > /dev/null 2>&1; then
            # Move the tag to this build, then swap the file; the download link stays the same.
            git push -f origin "$GITHUB_SHA:refs/tags/android-latest"
            gh release upload android-latest CoShare-android.apk --clobber
            gh release edit android-latest --title "$title" --notes "$notes" --latest=false
          else
            gh release create android-latest CoShare-android.apk --target "$GITHUB_SHA" \
              --title "$title" --notes "$notes" --latest=false
          fi
