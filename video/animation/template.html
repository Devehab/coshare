<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoShare intro animation</title>
<!-- Readex Pro + IBM Plex Mono, self-hosted with the website (render.sh serves the repo root). -->
<link rel="stylesheet" href="../../website/assets/fonts.css">
<style>
  /* The website's dark palette: warm ink, one signal colour, teal for connected/secure. */
  :root {
    --bg: #13120f; --text: #f4eee3; --muted: #aca392; --dim: #857c6d;
    --line: #3a352d; --dev: #1e1c18; --screen1: #24211c; --screen2: #191713;
    --signal: #ff6b3d; --fill: #d24a22; --on-fill: #fff8f0; --teal: #3fc3b2; --on-teal: #0b1f1c; --danger: #ff8c75;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; height: 100%; overflow: hidden; font-family: "Readex Pro", system-ui, sans-serif; color: var(--text); }
  #viewport { position: fixed; inset: 0; }
  #stage { position: absolute; left: 50%; top: calc(50% - 30px); width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); transform-origin: center; }
  body.render #stage { left: 0; top: 0; transform: none !important; }

  .layer, .scene { position: absolute; inset: 0; }
  .abs { position: absolute; will-change: transform, opacity; }
  .center { transform-origin: center; }

  /* background: a warm glow and the website's dot grid */
  #bg { background:
      radial-gradient(900px 600px at 85% 0%, rgba(255,107,61,.16), transparent 60%),
      radial-gradient(800px 600px at 0% 20%, rgba(242,178,60,.07), transparent 60%),
      radial-gradient(1000px 700px at 50% 120%, rgba(210,74,34,.12), transparent 60%); }
  #grid { background-image: radial-gradient(rgba(244,238,227,.09) 1.6px, transparent 2px);
    background-size: 32px 32px; -webkit-mask-image: radial-gradient(ellipse at 50% 40%, #000 0%, transparent 72%); mask-image: radial-gradient(ellipse at 50% 40%, #000 0%, transparent 72%); }

  /* typography */
  .headline { position: absolute; left: 0; right: 0; top: 96px; text-align: center; font-size: 66px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; padding: 0 120px; }
  html[lang="ar"] .headline { letter-spacing: 0; font-size: 70px; line-height: 1.35; }
  .signal { color: var(--signal); }
  .sub { font-size: 30px; color: var(--muted); font-weight: 400; }
  .ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }

  /* devices */
  .phone { width: 300px; height: 610px; border-radius: 52px; background: var(--dev); border: 3px solid var(--line); box-shadow: 0 40px 100px -30px rgba(0,0,0,.7); }
  .phone .screen { position: absolute; inset: 13px; border-radius: 40px; background: linear-gradient(var(--screen1), var(--screen2)); overflow: hidden; }
  .phone .notch { position: absolute; top: 14px; left: 50%; width: 96px; height: 26px; margin-left: -48px; border-radius: 14px; background: #0b0a08; }
  .laptop { width: 700px; }
  .laptop .lid { position: relative; height: 440px; border-radius: 26px; background: var(--dev); border: 3px solid var(--line); box-shadow: 0 40px 100px -30px rgba(0,0,0,.7); }
  .laptop .lid .screen { position: absolute; inset: 16px; border-radius: 14px; background: linear-gradient(var(--screen1), var(--screen2)); overflow: hidden; }
  .laptop .base { height: 30px; margin: 0 -40px; background: #2a2620; border: 3px solid var(--line); border-top: 0; clip-path: polygon(0 0, 100% 0, 96% 100%, 4% 100%); border-radius: 0 0 20px 20px; }
  .pc { width: 330px; }
  .pc .mon { position: relative; height: 210px; border-radius: 16px; background: var(--dev); border: 3px solid var(--line); }
  .pc .mon .screen { position: absolute; inset: 10px; border-radius: 8px; background: linear-gradient(var(--screen1), var(--screen2)); overflow: hidden; }
  .pc .stand { width: 90px; height: 34px; margin: 0 auto; background: #2a2620; clip-path: polygon(20% 0, 80% 0, 100% 100%, 0 100%); }
  .mini-phone { width: 150px; height: 300px; border-radius: 28px; background: var(--dev); border: 3px solid var(--line); }
  .mini-phone .screen { position: absolute; inset: 8px; border-radius: 21px; background: linear-gradient(var(--screen1), var(--screen2)); overflow: hidden; }

  .label-sm { font-size: 22px; color: var(--muted); }
  .bubble { position: absolute; left: 22px; right: 22px; top: 96px; padding: 22px 22px 20px; border-radius: 26px; background: #302b24; }
  .bubble .from { font-size: 18px; color: var(--muted); }
  .bubble .msg { font-size: 22px; color: #e2dbcd; margin-top: 6px; }
  .bubble .code { font-family: var(--mono); font-size: 40px; font-weight: 500; letter-spacing: 1px; margin-top: 6px; direction: ltr; white-space: nowrap; text-align: left; }
  .copy-btn { position: absolute; left: 50%; top: 330px; width: 170px; height: 58px; margin-left: -85px; border-radius: 30px; background: var(--fill); color: var(--on-fill); display: grid; place-items: center; font-size: 22px; font-weight: 600; }
  .skeleton { position: absolute; left: 26px; height: 16px; border-radius: 8px; background: #2d2924; }

  .field { position: absolute; left: 60px; right: 60px; top: 150px; height: 96px; border-radius: 18px; background: #1e1c18; border: 2px solid var(--line); display: flex; align-items: center; padding: 0 30px; direction: ltr; }
  .field .val { font-family: var(--mono); font-size: 48px; font-weight: 500; letter-spacing: 6px; }
  .field .cursor { width: 3px; height: 50px; background: var(--signal); margin-left: 6px; }
  .screen-title { position: absolute; left: 60px; top: 70px; font-size: 26px; color: var(--muted); }
  .continue { position: absolute; left: 60px; top: 280px; width: 200px; height: 56px; border-radius: 28px; background: var(--fill); color: var(--on-fill); display: grid; place-items: center; font-size: 22px; font-weight: 600; opacity: .9; }

  .chip { padding: 18px 30px; border-radius: 22px; background: var(--fill); color: var(--on-fill); font-family: var(--mono); font-size: 40px; font-weight: 500; letter-spacing: 2px; direction: ltr; white-space: nowrap; box-shadow: 0 0 60px rgba(255,107,61,.55), 0 20px 50px -10px rgba(210,74,34,.8); }
  .toast { padding: 14px 26px; border-radius: 30px; background: var(--teal); color: var(--on-teal); font-weight: 700; font-size: 26px; white-space: nowrap; display: flex; align-items: center; gap: 10px; }
  .toast svg { width: 28px; height: 28px; }
  .pill { padding: 14px 28px; border-radius: 40px; background: rgba(244,238,227,.06); border: 2px solid rgba(244,238,227,.14); font-size: 28px; color: #e2dbcd; display: flex; align-items: center; gap: 14px; white-space: nowrap; }
  .pill svg { width: 34px; height: 34px; }
  .pill.red { background: rgba(255,140,117,.09); border-color: rgba(255,140,117,.45); color: #ffc9bc; }
  .pill.green { background: rgba(63,195,178,.1); border-color: rgba(63,195,178,.45); color: #b5ece4; }

  .dev-card { width: 270px; height: 250px; border-radius: 34px; background: linear-gradient(180deg, rgba(244,238,227,.07), rgba(244,238,227,.02)); border: 2px solid rgba(244,238,227,.1); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  .dev-card svg { width: 84px; height: 84px; }
  .dev-card .name { font-size: 28px; font-weight: 600; }
  .dev-card .acct { font-size: 19px; color: var(--muted); direction: ltr; }
  .xmark { width: 70px; height: 70px; border-radius: 50%; background: rgba(255,140,117,.15); border: 2px solid rgba(255,140,117,.6); display: grid; place-items: center; color: var(--danger); }
  .xmark svg { width: 34px; height: 34px; }

  .logo { width: 230px; height: 230px; border-radius: 57.5px; box-shadow: 0 0 120px rgba(255,107,61,.45), 0 30px 80px -20px rgba(210,74,34,.8); }
  .wordmark { font-size: 120px; font-weight: 700; letter-spacing: -0.03em; direction: ltr; }
  .node { width: 150px; height: 150px; border-radius: 50%; background: var(--dev); border: 3px solid var(--line); display: grid; place-items: center; box-shadow: 0 20px 60px -20px rgba(0,0,0,.8); }
  .node svg { width: 70px; height: 70px; }
  .node-label { position: absolute; top: 166px; left: 50%; transform: translateX(-50%); font-size: 26px; color: var(--muted); white-space: nowrap; direction: ltr; }

  /* a photo being shared: a warm sunset */
  .shot { border-radius: 16px; overflow: hidden; background: linear-gradient(160deg, #f2b23c, #ff6b3d 55%, #b93d18); position: relative; }
  .shot::before { content: ""; position: absolute; left: 14%; top: 18%; width: 22%; height: 26%; border-radius: 50%; background: rgba(255,248,240,.8); }
  .shot::after { content: ""; position: absolute; left: -10%; right: -10%; bottom: -30%; height: 75%; background: #3a1c10; transform: rotate(-8deg); border-radius: 40% 60% 0 0; }
  .shot .tag { position: absolute; right: 10px; top: 10px; z-index: 2; font-size: 16px; font-weight: 700; padding: 4px 10px; border-radius: 10px; background: rgba(0,0,0,.45); }

  .pcard { width: 420px; height: 360px; border-radius: 36px; background: linear-gradient(180deg, rgba(244,238,227,.07), rgba(244,238,227,.02)); border: 2px solid rgba(244,238,227,.12); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  .pcard .who { display: flex; align-items: center; gap: 12px; font-size: 26px; color: var(--muted); }
  .pcard .who svg { width: 34px; height: 34px; }
  .pcard .pcode { font-family: var(--mono); font-size: 76px; font-weight: 500; letter-spacing: 4px; direction: ltr; font-variant-numeric: tabular-nums; }
  .pcard .hint { font-size: 22px; color: var(--dim); }
  .pcard .btns { display: flex; gap: 16px; margin-top: 8px; }
  .pcard .btns span { font-size: 24px; padding: 12px 30px; border-radius: 30px; background: rgba(244,238,227,.09); }
  .pcard .btns span.allow { background: var(--fill); color: var(--on-fill); font-weight: 600; }
  .link-dot { width: 96px; height: 96px; border-radius: 50%; background: var(--fill); color: var(--on-fill); display: grid; place-items: center; box-shadow: 0 0 0 16px rgba(255,107,61,.14); }
  .link-dot svg { width: 46px; height: 46px; }
  .pointer { width: 46px; height: 46px; }

  .platforms { display: flex; gap: 22px; }
  .platforms .pc-chip { display: flex; align-items: center; gap: 12px; padding: 14px 26px; border-radius: 40px; background: rgba(244,238,227,.05); border: 2px solid rgba(244,238,227,.1); font-size: 28px; color: #e2dbcd; direction: ltr; }
  .platforms svg { width: 32px; height: 32px; }

  /* preview controls (hidden while rendering) */
  #controls { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; gap: 12px; align-items: center; background: rgba(19,18,15,.9); border: 1px solid #3a352d; padding: 10px 16px; border-radius: 14px; font: 14px system-ui; color: #e2dbcd; z-index: 10; }
  #controls input[type=range] { width: 420px; accent-color: #ff6b3d; }
  #controls button { background: #d24a22; color: white; border: 0; border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  body.render #controls { display: none; }
</style>
</head>
<body>
<!--ICONS-->
<div id="viewport">
<div id="stage">
  <div class="layer" id="bg"></div>
  <div class="layer" id="grid"></div>

  <!-- ============ SCENE 1: hook ============ -->
  <div class="scene" id="s1">
    <div class="headline" id="s1h1"></div>
    <div class="headline" id="s1h2"></div>
    <div class="abs phone" id="s1phone" style="left:300px; top:330px">
      <div class="screen">
        <div class="notch"></div>
        <div class="bubble abs" id="s1bubble">
          <div class="from" data-t="msgFrom"></div>
          <div class="msg" data-t="msgText"></div>
          <div class="code">482 913</div>
        </div>
        <div class="skeleton" style="top:360px; width:220px"></div>
        <div class="skeleton" style="top:392px; width:170px"></div>
        <div class="skeleton" style="top:424px; width:200px"></div>
      </div>
    </div>
    <div class="abs laptop" id="s1laptop" style="left:900px; top:400px">
      <div class="lid"><div class="screen">
        <div class="screen-title" data-t="verify"></div>
        <div class="field"><span class="val" id="s1val"></span><span class="cursor" id="s1cursor"></span></div>
        <div class="continue" data-t="continue"></div>
      </div></div>
      <div class="base"></div>
    </div>
    <div class="abs pill" id="s1clock" style="left:1440px; top:300px"><svg><use href="#i-clock"/></svg><span class="ltr">0:03</span></div>
  </div>

  <!-- ============ SCENE 2: problem ============ -->
  <div class="scene" id="s2">
    <div class="headline" id="s2h1"></div>
    <div class="headline" id="s2h2"></div>
    <div class="abs dev-card" id="s2d0" style="left:180px; top:470px"><svg><use href="#i-phone"/></svg><div class="name">iPhone</div><div class="acct">Apple ID · ehab@</div></div>
    <div class="abs dev-card" id="s2d1" style="left:620px; top:470px"><svg><use href="#i-laptop"/></svg><div class="name">Mac</div><div class="acct">Apple ID · work@</div></div>
    <div class="abs dev-card" id="s2d2" style="left:1060px; top:470px"><svg><use href="#i-android"/></svg><div class="name">Android</div><div class="acct">Google</div></div>
    <div class="abs dev-card" id="s2d3" style="left:1500px; top:470px"><svg><use href="#i-windows"/></svg><div class="name">Windows</div><div class="acct">Microsoft</div></div>
    <div class="abs xmark" id="s2x0" style="left:500px; top:560px"><svg><use href="#i-x"/></svg></div>
    <div class="abs xmark" id="s2x1" style="left:940px; top:560px"><svg><use href="#i-x"/></svg></div>
    <div class="abs xmark" id="s2x2" style="left:1380px; top:560px"><svg><use href="#i-x"/></svg></div>
    <div class="abs pill" id="s2self" style="left:180px; top:800px"><svg><use href="#i-message"/></svg><span data-t="selfMsg"></span></div>
    <div class="abs pill" id="s2type" style="left:700px; top:800px"><svg><use href="#i-sad"/></svg><span data-t="retype"></span></div>
  </div>

  <!-- ============ SCENE 3: meet CoShare ============ -->
  <div class="scene" id="s3">
    <svg class="layer" id="s3lines" viewBox="0 0 1920 1080"></svg>
    <svg class="abs logo" id="s3logo" style="left:845px; top:300px"><use href="#i-logo"/></svg>
    <div class="abs wordmark" id="s3word" style="left:0; right:0; top:560px; text-align:center">CoShare</div>
    <div class="abs sub" id="s3tag" style="left:0; right:0; top:720px; text-align:center; font-size:40px"></div>
    <div class="abs pill green" id="s3any" style="left:50%; top:900px"><svg><use href="#i-user-x"/></svg><span data-t="anyAccount"></span></div>
  </div>

  <!-- ============ SCENE 4: copy & paste demo ============ -->
  <div class="scene" id="s4">
    <div class="headline" id="s4h1"></div>
    <div class="headline" id="s4h2"></div>
    <div class="headline" id="s4h3"></div>
    <div class="abs phone" id="s4phone" style="left:200px; top:330px">
      <div class="screen">
        <div class="notch"></div>
        <div class="bubble abs">
          <div class="from" data-t="msgFrom"></div>
          <div class="msg" data-t="msgText"></div>
          <div class="code">482 913</div>
        </div>
        <div class="copy-btn abs" id="s4copy"><span data-t="copy"></span></div>
        <div class="abs" id="s4ripple" style="left:50%; top:359px; width:20px; height:20px; margin:-10px 0 0 -10px; border-radius:50%; border:3px solid #ff6b3d"></div>
      </div>
    </div>
    <div class="abs laptop" id="s4laptop" style="left:760px; top:330px">
      <div class="lid"><div class="screen">
        <div class="screen-title" data-t="verify"></div>
        <div class="field"><span class="val" id="s4val"></span><span class="cursor" id="s4cursor"></span></div>
        <div class="continue" data-t="continue"></div>
        <div class="abs shot" id="s4shotSrc" style="left:400px; top:268px; width:200px; height:130px"><span class="tag">PNG</span></div>
      </div></div>
      <div class="base"></div>
    </div>
    <div class="abs toast" id="s4toast" style="left:1150px; top:300px"><svg><use href="#i-check"/></svg><span data-t="pasted"></span></div>
    <div class="abs pc" id="s4pc" style="left:1530px; top:760px"><div class="mon"><div class="screen"><div class="abs shot" id="s4shotPc" style="left:22px; top:18px; width:266px; height:154px"><span class="tag">100%</span></div></div></div><div class="stand"></div></div>
    <div class="abs mini-phone" id="s4and" style="left:1560px; top:400px"><div class="screen"><div class="abs shot" id="s4shotAnd" style="left:10px; top:70px; width:116px; height:140px"><span class="tag">100%</span></div></div></div>
    <div class="abs chip" id="s4chip" style="left:0; top:0">482 913</div>
    <div class="abs shot" id="s4fly1" style="left:0; top:0; width:200px; height:130px"></div>
    <div class="abs shot" id="s4fly2" style="left:0; top:0; width:200px; height:130px"></div>
  </div>

  <!-- ============ SCENE 5: network ============ -->
  <div class="scene" id="s5">
    <div class="headline" id="s5h1"></div>
    <div class="headline" id="s5h2"></div>
    <div class="headline" id="s5h3"></div>
    <svg class="layer" id="s5net" viewBox="0 0 1920 1080"></svg>
    <div class="abs pill red" id="s5cloud" style="left:50%; top:270px"><svg><use href="#i-cloud-off"/></svg><span data-t="noCloud"></span></div>
    <div class="abs pill green" id="s5lock" style="left:50%; top:270px"><svg><use href="#i-lock"/></svg><span data-t="encrypted"></span></div>
  </div>

  <!-- ============ SCENE 6: pairing & privacy ============ -->
  <div class="scene" id="s6">
    <div class="headline" id="s6h1"></div>
    <div class="headline" id="s6h2"></div>
    <div class="abs pcard" id="s6a" style="left:260px; top:390px">
      <div class="who"><svg><use href="#i-phone"/></svg><span data-t="newPhone"></span></div>
      <div class="pcode">974 291</div>
      <div class="hint" id="s6wait"></div>
    </div>
    <div class="abs link-dot" id="s6link" style="left:752px; top:522px"><svg><use href="#i-link"/></svg></div>
    <div class="abs pcard" id="s6b" style="left:920px; top:390px">
      <div class="who"><svg><use href="#i-laptop"/></svg><span data-t="workMac"></span></div>
      <div class="pcode">974 291</div>
      <div class="hint" data-t="match"></div>
      <div class="btns"><span data-t="deny"></span><span class="allow" id="s6allow" data-t="allow"></span></div>
    </div>
    <svg class="abs pointer" id="s6ptr" viewBox="0 0 24 24" style="left:0; top:0"><path d="M4 2l15 9-6.5 1.5L16 20l-3 1.5-3.5-7.5L4 19z" fill="#f4eee3" stroke="#13120f" stroke-width="1.2" stroke-linejoin="round"/></svg>
    <div class="abs pill" id="s6qr" style="left:260px; top:800px"><svg><use href="#i-qr"/></svg><span data-t="orQr"></span></div>
    <div class="abs dev-card" id="s6stranger" style="left:1480px; top:420px; filter:grayscale(1)"><svg><use href="#i-user-x"/></svg><div class="name" data-t="stranger"></div><div class="acct" data-t="sameWifi"></div></div>
    <div class="abs xmark" id="s6shield" style="left:1580px; top:340px"><svg><use href="#i-x"/></svg></div>
    <div class="abs pill red" id="s6sees" style="left:1440px; top:720px"><svg><use href="#i-eye-off"/></svg><span data-t="seesNothing"></span></div>
    <div class="abs chip" id="s6probe" style="left:0; top:0; font-size:30px; padding:12px 22px">•••</div>
  </div>

  <!-- ============ SCENE 7: end card ============ -->
  <div class="scene" id="s7">
    <svg class="abs logo" id="s7logo" style="left:845px; top:190px"><use href="#i-logo"/></svg>
    <div class="abs wordmark" id="s7word" style="left:0; right:0; top:450px; text-align:center">CoShare</div>
    <div class="abs" id="s7tag" style="left:0; right:0; top:610px; text-align:center; font-size:64px; font-weight:700"></div>
    <div class="abs platforms" id="s7plat" style="left:50%; top:760px">
      <span class="pc-chip"><svg><use href="#i-phone"/></svg>iOS</span>
      <span class="pc-chip"><svg><use href="#i-laptop"/></svg>macOS</span>
      <span class="pc-chip"><svg><use href="#i-android"/></svg>Android</span>
      <span class="pc-chip"><svg><use href="#i-windows"/></svg>Windows</span>
      <span class="pc-chip"><svg><use href="#i-linux"/></svg>Linux</span>
    </div>
    <div class="abs sub" id="s7free" style="left:0; right:0; top:880px; text-align:center; font-size:34px"></div>
  </div>
</div>
</div>

<div id="controls"><button id="playBtn">⏸</button><input id="scrub" type="range" min="0" max="60" step="0.01" value="0"><span id="tlabel">0.0s</span>
  <button id="langBtn">AR / EN</button></div>

<script>
"use strict";
const DURATION = 60;
const params = new URLSearchParams(location.search);
const LANG = params.get("lang") === "ar" ? "ar" : "en";
document.documentElement.lang = LANG;
document.documentElement.dir = LANG === "ar" ? "rtl" : "ltr";

const T = {
  en: {
    s1h1: "A code just landed on your phone…",
    s1h2: "…and you need it on your laptop. <span class='signal'>Now.</span>",
    msgFrom: "Messages · now", msgText: "Your verification code is", verify: "Sign in · Verification code", continue: "Continue",
    s2h1: "So you retype it. Or text it to yourself.",
    s2h2: "Different accounts. <span class='signal'>Different systems.</span>",
    selfMsg: "Note to self: 482913", retype: "Typing it by hand… again",
    s3tag: "One clipboard for <span class='signal'>all your devices</span>", anyAccount: "Any account · any system",
    s4h1: "Copy on one device…", s4h2: "…paste on all of them. <span class='signal'>Instantly.</span>", s4h3: "Text and images — <span class='signal'>full quality.</span>",

// ---------- timing helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  out: x => 1 - Math.pow(1 - x, 3),
  inOut: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  back: x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
};
/** 0→1 between a..b, holds, 1→0 between c..d */
const win = (t, a, b, c, d) => Math.min(E.out(prog(t, a, b)), 1 - E.inOut(prog(t, c, d)));
const lerp = (a, b, x) => a + (b - a) * x;
function put(el, o, x = 0, y = 0, s = 1, extra = "") {
  el.style.opacity = o.toFixed(3);
  el.style.visibility = o <= 0.001 ? "hidden" : "visible";
  el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) scale(${s.toFixed(3)}) ${extra}`;
}
/** Fade-up entrance + fade-down exit. */
function rise(el, t, a, b, c, d, dist = 60) {
  const i = E.out(prog(t, a, b)), o = E.inOut(prog(t, c, d));
  put(el, Math.min(i, 1 - o), 0, (1 - i) * dist - o * dist * 0.5);
}
function pop(el, t, a, b, c, d, baseX = 0, baseY = 0) {
  const i = prog(t, a, b), o = E.inOut(prog(t, c, d));
  put(el, Math.min(E.out(i), 1 - o), baseX, baseY, lerp(.6, 1, E.back(i)) * (1 - o * .15));
}
function bezier(p0, p1, p2, p3, x) {
  const u = 1 - x;
  return [u*u*u*p0[0] + 3*u*u*x*p1[0] + 3*u*x*x*p2[0] + x*x*x*p3[0], u*u*u*p0[1] + 3*u*u*x*p1[1] + 3*u*x*x*p2[1] + x*x*x*p3[1]];
}
const sceneVis = (t, a, d) => win(t, a, a + .5, d - .6, d);

// ---------- the timeline ----------
function renderAt(t) {
  // gentle background drift
  $("bg").style.transform = `translate(${Math.sin(t / 9) * 30}px, ${Math.cos(t / 11) * 20}px) scale(1.08)`;
  $("grid").style.transform = `translateY(${(t * 6) % 64}px)`;

  // ===== Scene 1: 0–7 =====
  const v1 = sceneVis(t, 0, 7);
  $("s1").style.opacity = v1; $("s1").style.visibility = v1 > 0 ? "visible" : "hidden";
  if (v1 > 0) {
    rise($("s1h1"), t, .3, 1.1, 3.1, 3.5);
    rise($("s1h2"), t, 3.5, 4.3, 7, 7.5);
    const ph = E.out(prog(t, .2, 1.1)); put($("s1phone"), ph, 0, (1 - ph) * 160);
    pop($("s1bubble"), t, 1.0, 1.5, 99, 100);
    const lp = E.out(prog(t, 1.6, 2.5)); put($("s1laptop"), lp, (1 - lp) * 120, 0);
    $("s1cursor").style.opacity = (t * 2 % 1) < .55 ? 1 : 0;
    $("s1val").textContent = "";
    pop($("s1clock"), t, 4.2, 4.7, 99, 100);
    $("s1clock").querySelector(".ltr").textContent = "0:0" + Math.min(9, Math.floor(clamp(t - 4.2, 0, 9) * 2) + 1);
  }

  // ===== Scene 2: 7–15 =====
  const v2 = sceneVis(t, 7, 15);
  $("s2").style.opacity = v2; $("s2").style.visibility = v2 > 0 ? "visible" : "hidden";
  if (v2 > 0) {
    rise($("s2h1"), t, 7.3, 8.1, 10.6, 11);
    rise($("s2h2"), t, 11, 11.8, 99, 100);
    for (let i = 0; i < 4; i++) {
      const k = E.out(prog(t, 7.4 + i * .25, 8.2 + i * .25));
      put($("s2d" + i), k, 0, (1 - k) * 80, 1);
    }
    for (let i = 0; i < 3; i++) pop($("s2x" + i), t, 9.0 + i * .25, 9.5 + i * .25, 99, 100);
    rise($("s2self"), t, 8.6, 9.3, 99, 100, 30);
    rise($("s2type"), t, 9.4, 10.1, 99, 100, 30);
    // gentle shake of the x marks when the second line appears
    const shake = Math.sin(t * 40) * 6 * (1 - prog(t, 11.1, 11.8)) * (t > 11.1 ? 1 : 0);
    for (let i = 0; i < 3; i++) $("s2x" + i).style.marginLeft = shake + "px";
  }

  // ===== Scene 3: 15–24 =====
  const v3 = sceneVis(t, 15, 24);
  s3.style.opacity = v3; s3.style.visibility = v3 > 0 ? "visible" : "hidden";
  if (v3 > 0) {
    const lg1 = prog(t, 15.2, 16.4);
    put($("s3logo"), E.out(lg1), 0, 0, lerp(.4, 1, E.back(lg1)));
    $("s3logo").style.top = lerp(300, 300, 1) + "px";
    rise($("s3word"), t, 16.0, 16.8, 99, 100, 40);
    rise($("s3tag"), t, 16.8, 17.6, 99, 100, 30);
    ORBIT.forEach((n, i) => {
      const k = prog(t, 18.2 + i * .35, 19.0 + i * .35);
      put(s3Nodes[i], E.out(k), 0, 0, lerp(.5, 1, E.back(k)));
      const L = Math.hypot(n.x - 960, n.y - 415);
      const lk = E.inOut(prog(t, 18.4 + i * .35, 19.4 + i * .35));
      s3Lines[i].setAttribute("stroke-dasharray", `${L}`); s3Lines[i].setAttribute("stroke-dashoffset", `${L * (1 - lk)}`);
      s3Lines[i].setAttribute("opacity", (lk * .8).toFixed(2));
    });
    // words fade a bit so lines are readable behind them
    const pa = prog(t, 21.8, 22.6);
    put($("s3any"), E.out(pa), -$("s3any").offsetWidth / 2, (1 - E.out(pa)) * 30);
  }

  // ===== Scene 4: 24–34 =====
  const v4 = sceneVis(t, 24, 34);
  $("s4").style.opacity = v4; $("s4").style.visibility = v4 > 0 ? "visible" : "hidden";
  if (v4 > 0) {
    rise($("s4h1"), t, 24.3, 25.0, 27.0, 27.4);
    rise($("s4h2"), t, 27.4, 28.1, 30.2, 30.6);
    rise($("s4h3"), t, 30.6, 31.3, 99, 100);
    const pin = E.out(prog(t, 24.1, 24.9)); put($("s4phone"), pin, (1 - pin) * -100, 0);
    const lin = E.out(prog(t, 24.3, 25.1)); put($("s4laptop"), lin, (1 - lin) * 100, 0);
    // copy press
    const press = prog(t, 25.0, 25.3);
    const sc = 1 - Math.sin(press * Math.PI) * .1;
    $("s4copy").style.transform = `scale(${sc})`;
    const rp = prog(t, 25.05, 25.9);
    put($("s4ripple"), rp > 0 && rp < 1 ? 1 - rp : 0, 0, 0, 1 + rp * 9);
    // flying chip
    const fly = E.inOut(prog(t, 25.4, 26.9));
    const [cx, cy] = bezier([350, 560], [600, 230], [1000, 230], [1120, 520], fly);
    const chipVis = t >= 25.4 && t < 27.05 ? Math.min(prog(t, 25.4, 25.6), 1 - prog(t, 26.85, 27.05)) : 0;
    put($("s4chip"), chipVis, cx - 120, cy - 45, 1 + Math.sin(fly * Math.PI) * .12);
    $("s4val").textContent = t >= 27.0 ? "482913" : "";
    $("s4cursor").style.opacity = t < 27 && (t * 2 % 1) < .55 ? 1 : 0;
    const tst = prog(t, 27.1, 27.5);
    put($("s4toast"), Math.min(E.out(tst), 1 - prog(t, 29.3, 29.7)), 0, (1 - E.out(tst)) * 20, lerp(.7, 1, E.back(tst)));
    // screenshot appears on the laptop and flies to Windows + Android
    pop($("s4shotSrc"), t, 29.5, 30.0, 99, 100);
    const pcIn = E.out(prog(t, 28.6, 29.4)); put($("s4pc"), pcIn, 0, (1 - pcIn) * 80);
    const anIn = E.out(prog(t, 28.8, 29.6)); put($("s4and"), anIn, 0, (1 - anIn) * 80);
    const f1 = E.inOut(prog(t, 30.2, 31.4)), f2 = E.inOut(prog(t, 30.4, 31.6));
    const [x1, y1] = bezier([1176, 614], [1300, 540], [1500, 600], [1640, 800], f1);
    const [x2, y2] = bezier([1176, 614], [1300, 420], [1500, 420], [1580, 480], f2);
    put($("s4fly1"), t > 30.2 && t < 31.45 ? 1 : 0, x1 - 100, y1 - 65, lerp(1, 1.3, f1));
    put($("s4fly2"), t > 30.4 && t < 31.65 ? 1 : 0, x2 - 100, y2 - 65, lerp(1, .6, f2));
    pop($("s4shotPc"), t, 31.4, 31.8, 99, 100);
    pop($("s4shotAnd"), t, 31.6, 32.0, 99, 100);
  }

  // ===== Scene 5: 34–44 =====
  const v5 = sceneVis(t, 34, 44);
  s5.style.opacity = v5; s5.style.visibility = v5 > 0 ? "visible" : "hidden";
  if (v5 > 0) {
    rise($("s5h1"), t, 34.3, 35.0, 37.4, 37.8);
    rise($("s5h2"), t, 37.8, 38.5, 40.4, 40.8);
    rise($("s5h3"), t, 40.8, 41.5, 99, 100);
    pop(hub, t, 34.3, 35.0, 99, 100);
    glow5.setAttribute("opacity", (E.out(prog(t, 34.3, 35.2)) * (0.75 + Math.sin(t * 3) * .25)).toFixed(2));
    rings5.forEach((r, i) => {
      const ph = ((t - 34.5) / 2.4 + i / 3) % 1;
      r.setAttribute("r", (95 + ph * 260).toFixed(1));
      r.setAttribute("opacity", (t > 34.5 ? (1 - ph) * .5 : 0).toFixed(2));
    });
    NET.forEach((n, i) => {
      pop(nodes5[i], t, 34.6 + i * .2, 35.3 + i * .2, 99, 100);
      const L = Math.hypot(n.x - HUB.x, n.y - HUB.y);
      const lk = E.inOut(prog(t, 34.8 + i * .2, 35.6 + i * .2));
      lines5[i].setAttribute("stroke-dasharray", `${L}`); lines5[i].setAttribute("stroke-dashoffset", `${L * (1 - lk)}`);
      lines5[i].setAttribute("opacity", (lk * .85).toFixed(2));
    });
    // packets: device → hub → other device
    const routes = [[0, 1], [2, 3], [4, 0], [1, 2]];
    packets5.forEach((p, i) => {
      const cyc = ((t - 36 - i * .55) / 2.2);
      if (t < 36 + i * .55) { p.setAttribute("opacity", 0); return; }
      const ph = cyc % 1, [a, b] = routes[i];
      const A = NET[a], B = NET[b];
      const pt = ph < .5 ? [lerp(A.x, HUB.x, E.inOut(ph * 2)), lerp(A.y, HUB.y, E.inOut(ph * 2))]
                          : [lerp(HUB.x, B.x, E.inOut(ph * 2 - 1)), lerp(HUB.y, B.y, E.inOut(ph * 2 - 1))];
      p.setAttribute("cx", pt[0].toFixed(1)); p.setAttribute("cy", pt[1].toFixed(1));
      p.setAttribute("opacity", (Math.min(1, Math.sin(ph * Math.PI) * 3)).toFixed(2));
    });
    const cl = prog(t, 35.6, 36.3);
    put($("s5cloud"), Math.min(E.out(cl), 1 - prog(t, 40.3, 40.7)), -$("s5cloud").offsetWidth / 2, (1 - E.out(cl)) * -30);
    const lk = prog(t, 40.9, 41.6);
    put($("s5lock"), E.out(lk), -$("s5lock").offsetWidth / 2, (1 - E.out(lk)) * 30, lerp(.8, 1, E.back(lk)));
  }

  // ===== Scene 6: 44–53 =====
  const v6 = sceneVis(t, 44, 53);
  $("s6").style.opacity = v6; $("s6").style.visibility = v6 > 0 ? "visible" : "hidden";
  if (v6 > 0) {
    rise($("s6h1"), t, 44.3, 45.0, 48.6, 49.0);
    rise($("s6h2"), t, 49.0, 49.7, 99, 100);
    const shiftX = -220 * E.inOut(prog(t, 49.0, 49.8)); // make room for the stranger

    const click = prog(t, 47.7, 48.0);
    put($("s6ptr"), Math.min(E.out(prog(t, 46.2, 46.6)), 1 - prog(t, 48.4, 48.8)), px, py, 1 - Math.sin(click * Math.PI) * .2);
    $("s6wait").textContent = paired ? T.pairedOk : T.waiting;
    $("s6wait").style.color = paired ? "#3fc3b2" : "";
    $("s6allow").style.background = paired ? "#3fc3b2" : "";
    $("s6allow").style.color = paired ? "#0b1f1c" : "";
    rise($("s6qr"), t, 45.8, 46.5, 48.6, 49.0, 30);
    // stranger
    const st = E.out(prog(t, 49.4, 50.2));
    put($("s6stranger"), st * .85, (1 - st) * 160, 0);
    pop($("s6shield"), t, 50.4, 50.9, 99, 100);
    rise($("s6sees"), t, 51.0, 51.6, 99, 100, 30);
    // a clip tries to reach the stranger and bounces off
    const pr = prog(t, 50.1, 51.1);
    const bx = pr < .7 ? lerp(1110 + shiftX, 1440, E.inOut(pr / .7)) : lerp(1440, 1380, E.out((pr - .7) / .3));
    put($("s6probe"), t > 50.1 && t < 51.4 ? Math.min(1, (1 - prog(t, 51.0, 51.4)) * 1) : 0, bx - 50, 520, 1, pr > .7 ? "rotate(-12deg)" : "");
    $("s6probe").style.filter = pr > .7 ? "grayscale(1)" : "";
  }

  // ===== Scene 7: 53–60 =====
  const v7 = win(t, 53, 53.5, 99, 100);
  $("s7").style.opacity = v7; $("s7").style.visibility = v7 > 0 ? "visible" : "hidden";
  if (v7 > 0) {
    const lg7 = prog(t, 53.2, 54.2);
    const drift = 1 + prog(t, 54, 60) * .03;
    put($("s7logo"), E.out(lg7), 0, 0, lerp(.4, 1, E.back(lg7)) * drift);
    rise($("s7word"), t, 53.8, 54.5, 99, 100, 40);
    rise($("s7tag"), t, 54.4, 55.2, 99, 100, 30);
    const plat = $("s7plat");
    const pk = E.out(prog(t, 55.3, 56.0));
    put(plat, pk, -plat.offsetWidth / 2, (1 - pk) * 30);
    Array.from(plat.children).forEach((c, i) => {
      const k = E.out(prog(t, 55.4 + i * .15, 56.0 + i * .15));
      c.style.opacity = k; c.style.transform = `translateY(${(1 - k) * 20}px)`;
    });
    rise($("s7free"), t, 56.4, 57.1, 99, 100, 20);
    // fade to black at the very end
    $("stage").style.filter = `brightness(${1 - E.inOut(prog(t, 59.4, 60)) * .9})`;
  } else {
    $("stage").style.filter = "";
  }
}
// Optional retiming to a narration: ?keys=anim:audio,anim:audio,… maps narration time to animation time.
const KEYS = (params.get("keys") || "").split(",").filter(Boolean).map(pair => pair.split(":").map(Number));
function toAnimTime(tau) {
  if (KEYS.length < 2) return tau;
  for (let i = 0; i < KEYS.length - 1; i++) {
    const [a0, v0] = KEYS[i], [a1, v1] = KEYS[i + 1];
    if (tau <= v1 || i === KEYS.length - 2) return a0 + (a1 - a0) * clamp((tau - v0) / (v1 - v0));
  }
  return tau;
}
const TOTAL = KEYS.length >= 2 ? KEYS[KEYS.length - 1][1] : DURATION;
// Top-level function declarations live on window, so keep a handle before replacing it.
const renderAnimation = renderAt;
window.renderAt = tau => renderAnimation(toAnimTime(tau));
window.DURATION = TOTAL;

// ---------- preview player ----------
const isRender = params.has("render");
if (isRender) document.body.classList.add("render");
function fit() {
  if (isRender) return;
  const s = Math.min(innerWidth / 1920, (innerHeight - 70) / 1080);
  $("stage").style.transform = `translate(-50%, -50%) scale(${s})`;
}
addEventListener("resize", fit); fit();

// ?voice=path.mp3 plays the narration in the preview, in sync.
const voice = params.get("voice") && !isRender ? new Audio(params.get("voice")) : null;
$("scrub").max = TOTAL;
let playing = !isRender && !params.has("t") && !voice, start = performance.now() - (parseFloat(params.get("t")) || 0) * 1000;
function tick(now) {
  if (playing) {
    const t = voice ? voice.currentTime : ((now - start) / 1000) % TOTAL;
    window.renderAt(t); $("scrub").value = t; $("tlabel").textContent = t.toFixed(1) + "s";
    if (voice && voice.ended) { playing = false; $("playBtn").textContent = "▶"; }
  }
  requestAnimationFrame(tick);
}
// Wait for the self-hosted fonts (every face in use) before declaring the page ready.
Promise.all([
  document.fonts.load('700 66px "Readex Pro"', "CoShare انسخ"), document.fonts.load('400 30px "Readex Pro"', "a ا"),
  document.fonts.load('500 40px "IBM Plex Mono"', "482 913"),
]).then(() => document.fonts.ready).then(() => {
  window.renderAt(parseFloat(params.get("t")) || 0);
  window.READY = true;
  if (!isRender) requestAnimationFrame(tick);
});
$("playBtn").textContent = playing ? "⏸" : "▶";
$("playBtn").onclick = () => {
  playing = !playing; $("playBtn").textContent = playing ? "⏸" : "▶";
  start = performance.now() - $("scrub").value * 1000;
  if (voice) { if (playing) { voice.currentTime = +$("scrub").value; voice.play(); } else voice.pause(); }
};
$("scrub").oninput = e => {
  playing = false; $("playBtn").textContent = "▶"; if (voice) voice.pause();
  const t = +e.target.value; window.renderAt(t); $("tlabel").textContent = t.toFixed(1) + "s";
};
$("langBtn").onclick = () => { const p = new URLSearchParams(location.search); p.set("lang", LANG === "ar" ? "en" : "ar"); location.search = p.toString(); };
</script>
</body>
